worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include       mime.types;
  default_type  application/octet-stream;

  # Performance: sendfile + tcp_nopush for efficient file delivery
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Gzip compression for text-based responses
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Proxy cache zone for static uploads
  proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=uploads_cache:10m max_size=1g inactive=30d use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

    upstream alihbahasa_api {
    server 127.0.0.1:3001;
  }

  upstream alihbahasa_realtime {
    server 127.0.0.1:3002;
  }

  upstream bamboochat_api {
    server 127.0.0.1:3000;
  }

  server {
    listen 80;
    server_name api.bamboochat.click;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.bamboochat.click;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_certificate /etc/letsencrypt/live/api.bamboochat.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bamboochat.click/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 25m;

        # Alih Bahasa REST API
    location /v1/alihbahasa/ {
      proxy_pass http://alihbahasa_api/v1/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alih Bahasa Realtime WebSocket Gateway (Live STT/MT/TTS streaming)
    location /ws/alihbahasa/ {
      proxy_pass http://alihbahasa_realtime/v1/realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cached static uploads (images, documents, audio)
    location /uploads/ {
      proxy_pass http://bamboochat_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_cache uploads_cache;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location /socket.io/ {
      proxy_pass http://bamboochat_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://bamboochat_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}