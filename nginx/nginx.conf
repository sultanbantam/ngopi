worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include       mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream bamboochat_api {
    server 127.0.0.1:3000;
  }

  server {
    listen 80;
    server_name api.bamboochat.click;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.bamboochat.click;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_certificate /etc/letsencrypt/live/api.bamboochat.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bamboochat.click/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 25m;

    location /socket.io/ {
      proxy_pass http://bamboochat_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://bamboochat_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}